<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f8f3">
  <title>Dayfit</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="styles.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <a class="brand" href="#home" aria-label="Dayfit home"><span class="brand-mark">d</span><span>dayfit<span class="brand-dot">.</span></span></a>
      <div class="workspace-label">YOUR SPACE</div>
      <nav class="main-nav" id="main-nav" aria-label="Main navigation"></nav>
      <div class="sidebar-bottom">
        <div class="support-card"><span class="support-spark">✳</span><strong>A little better,<br>every day.</strong><span>Your wellbeing, your pace.</span><button class="text-button" data-go="wellness">Explore wellness <span>↗</span></button></div>
        <button class="profile-mini" data-go="profile"><span class="avatar">A</span><span class="profile-mini-copy"><strong id="side-name">Alex Morgan</strong><small>Free member</small></span><span class="more-dots">···</span></button>
      </div>
    </aside>
    <main class="main-area">
      <header class="topbar"><button class="mobile-menu" id="menu-toggle" aria-label="Open menu">☰</button><div class="crumb" id="crumb">Your overview <span>/</span> <strong>Today</strong></div><div class="top-actions"><span class="today-date" id="today-date"></span><button class="icon-button notification-button" aria-label="Notifications" id="notification-toggle">♧<i></i></button><button class="top-avatar" data-go="profile">A</button></div></header>
      <div id="app-content" class="content"></div>
      <footer class="disclaimer"><span>ⓘ</span> Dayfit offers general wellness information and does not replace professional medical advice or diagnosis.</footer>
    </main>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <div id="modal-root"></div>
</body>
</html>
